name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tree
        run: tools/no-game-data.sh

      - name: Build
        run: cargo build --release --locked -p nxb-cli -p nxb-extract -p nxb-build -p airc

      - name: Pack, sign and write the notes
        run: tools/release-package.sh "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "dist/nxb-${GITHUB_REF_NAME}-macos-arm64.zip" dist/SHA256SUMS
          --title "nxbuild ${GITHUB_REF_NAME}" --notes-file dist/notes.md
