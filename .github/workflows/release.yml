name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tree
        run: tools/no-game-data.sh

      - name: Build
        run: >
          cargo build --release --locked
          -p nxb-cli -p nxb-extract -p nxb-pack -p nxb-archive -p airc

      - name: Collect, sign and pack
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          dir="nxbuild-${tag}-macos-arm64"
          mkdir -p "$dir"
          for b in nxb nxb-extract nxb-split shaderbuild nxb-pso nxb-macapp nxb-ipa airc; do
            test -x "target/release/$b" || { echo "missing binary: $b"; exit 1; }
            cp "target/release/$b" "$dir/$b"
            codesign -s - --force "$dir/$b"
            codesign --verify "$dir/$b"
          done
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY.md "$dir/"
          zip -r "${dir}.zip" "$dir"
          shasum -a 256 "${dir}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from the changelog
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $version in CHANGELOG.md"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "nxbuild-${GITHUB_REF_NAME}-macos-arm64.zip" SHA256SUMS
          --title "nxbuild ${GITHUB_REF_NAME}" --notes-file notes.md
