version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L1"
in_v = false

[dependencies]
nxb-model.workspace = true
naga = { version = "30.0.1", default-features = false, features = ["spv-in", "msl-out"] }
glslang = "0.9.1"

[lints]
workspace = true
