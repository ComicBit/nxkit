[package]
name = "air-bc"
description = "LLVM 14 era typed-pointer bitcode for the AIR text IR air-emit writes (parser of that text subset and bitcode writer)"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "F"
in_v = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
