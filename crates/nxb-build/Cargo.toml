[package]
name = "nxb-build"
description = "nxb build: the NSP build script's command line as one stage graph (extract, split, shaders, pipeline archive, app) with the front ends' NDJSON events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L3"
in_v = false

[dependencies]
nxb-model.workspace = true
nxb-pyjson.workspace = true
nxb-sched.workspace = true
nxb-tool.workspace = true
nxb-extract.workspace = true
nxb-pack.workspace = true
nxb-archive.workspace = true
nxb-stages.workspace = true
nxb-shader.workspace = true

[features]
default = ["air-front"]
air-front = ["nxb-stages/air-front"]

[lints]
workspace = true
