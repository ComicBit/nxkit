[package]
name = "nxb-cli"
description = "The nxb and shaderbuild binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L3"
in_v = false

[[bin]]
name = "nxb"
path = "src/bin/nxb.rs"

[[bin]]
name = "shaderbuild"
path = "src/bin/shaderbuild.rs"

[dependencies]
nxb-model.workspace = true
nxb-error.workspace = true
nxb-obs.workspace = true
nxb-stages.workspace = true
nxb-build.workspace = true
nxb-extract.workspace = true
nxb-tool.workspace = true
nxb-store.workspace = true

[features]
default = ["air-front"]
air-front = ["nxb-stages/air-front"]

[lints]
workspace = true
