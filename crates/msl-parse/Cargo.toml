[package]
name = "msl-parse"
description = "Strict parser and type checker for the engine's machine-generated MSL (port of msl_parse.py)"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "F"
in_v = false

[dependencies]
msl-lex = { path = "../msl-lex" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
